[project]
name = "folio-engine"
version = "0.1.7"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sorodriguezz", email = "s.rodriguezzapata01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
pdf = [
    "babeldoc>=0.6.4",
    "bitstring>=4.3,<5",
    "pymupdf>=2.0",
    "rapidocr>=3.10.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
