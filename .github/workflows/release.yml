name: release

# Push a tag like v0.2.0 (see scripts/bump_version.py) to build, sign and publish.
# The release starts as a draft; each platform uploads its installer and updater
# bundle to it and tauri-action merges their entries into latest.json. Only when
# all three are in is it published, so releases/latest/download/latest.json (what
# the app's updater reads) never points at a release missing the user's system.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - working-directory: engine
        run: uv run pytest -q

  create-release:
    needs: test-engine
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - id: draft
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "AIBook $TAG" \
            --notes "Descarga el instalador para tu sistema. Si ya tienes AIBook, se actualizará solo desde la app."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.12"
          # PyMuPDF, OpenCV, hyperscan, cryptography… publish no win_arm64
          # wheels, so on Windows ARM the engine is frozen as x64 and runs under
          # Prism emulation. The app and llama-server stay native ARM64.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: cpython-3.12-windows-x86_64-none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}

      - name: Fetch llama.cpp server
        run: uv run --no-project python scripts/fetch_llama.py --target ${{ matrix.target }}

      - name: Freeze engine
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv run --project engine --extra pdf --group build python scripts/build_engine.py

      - name: Engine smoke test (frozen binary serves the app)
        shell: bash
        env:
          FOLIO_TOKEN: smoke
        run: |
          exe=app/src-tauri/resources/engine/folio-engine
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --port 0 > engine.log 2>&1 &
          for i in $(seq 1 90); do grep -q FOLIO_ENGINE_PORT engine.log && break; sleep 1; done
          port=$(grep -o 'FOLIO_ENGINE_PORT=[0-9]*' engine.log | cut -d= -f2)
          for i in $(seq 1 60); do curl -sf -H "x-folio-token: smoke" "http://127.0.0.1:$port/health" && break; sleep 1; done
          cat engine.log
          curl -sf -H "x-folio-token: smoke" "http://127.0.0.1:$port/health"
          # The preflight WebView2 sends before every call from the Windows app.
          curl -sf -o /dev/null -X OPTIONS "http://127.0.0.1:$port/jobs" \
            -H "Origin: http://tauri.localhost" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: x-folio-token,content-type" \
            -H "Access-Control-Request-Private-Network: true"

      - working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (ed25519), not OS code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.json
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: true

  publish-release:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild latest.json from the signed bundles
        run: |
          mkdir sigs
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "*.sig" -D sigs
          python3 scripts/updater_manifest.py "$TAG" "$GITHUB_REPOSITORY" sigs
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" latest.json --clobber
      - name: Publish
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
