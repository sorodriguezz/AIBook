name: release

# Push a new version to main: validate, create its tag, build, sign and publish.
# The release starts as a draft; each platform uploads its installer and updater
# bundle to it and tauri-action merges their entries into latest.json. Only when
# all three are in is it published, so releases/latest/download/latest.json (what
# the app's updater reads) never points at a release missing the user's system.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One publication at a time; never cancel an installer build in progress.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release automation
        run: python3 -m unittest discover -s scripts -p test_release.py -v
      - name: Validate version and create its tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/prepare_release.py

  test-engine:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - working-directory: engine
        run: uv run pytest -q

  create-release:
    needs: [prepare, test-engine]
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.prepare.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # The id comes straight from the create call; listing releases right
      # after creating one can miss it, which silently disabled every upload.
      - id: draft
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -n "$existing" ]; then
            echo "id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="AIBook $TAG" \
            -F draft=true -f body="Descarga el instalador para tu sistema. Si ya tienes AIBook, se actualizará solo desde la app." \
            --jq .id)
          [ -n "$id" ] || exit 1
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.12"
          # PyMuPDF, OpenCV, hyperscan, cryptography… publish no win_arm64
          # wheels, so on Windows ARM the engine is frozen as x64 and runs under
          # Prism emulation. The app and llama-server stay native ARM64.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: cpython-3.12-windows-x86_64-none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}

      - name: Fetch llama.cpp server
        run: uv run --no-project python scripts/fetch_llama.py --target ${{ matrix.target }}

      - name: Freeze engine
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv run --project engine --extra pdf --group build python scripts/build_engine.py

      - name: Engine smoke test (frozen binary serves the app)
        shell: bash
        env:
          FOLIO_TOKEN: smoke
        run: |
          exe=app/src-tauri/resources/engine/folio-engine
          [ -f "$exe.exe" ] && exe="$exe.exe"
          # Everything translation imports lazily must be in the frozen build.
          "$exe" --selfcheck
          "$exe" --port 0 > engine.log 2>&1 &
          for i in $(seq 1 90); do grep -q FOLIO_ENGINE_PORT engine.log && break; sleep 1; done
          port=$(grep -o 'FOLIO_ENGINE_PORT=[0-9]*' engine.log | cut -d= -f2)
          for i in $(seq 1 60); do curl -sf -H "x-folio-token: smoke" "http://127.0.0.1:$port/health" && break; sleep 1; done
          cat engine.log
          curl -sf -H "x-folio-token: smoke" "http://127.0.0.1:$port/health"
          # The preflight WebView2 sends before every call from the Windows app.
          curl -sf -o /dev/null -X OPTIONS "http://127.0.0.1:$port/jobs" \
            -H "Origin: http://tauri.localhost" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: x-folio-token,content-type" \
            -H "Access-Control-Request-Private-Network: true"

      - working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (ed25519), not OS code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.json
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: true

      - name: Verify macOS app signature before publishing the release
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/AIBook.app"

  publish-release:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.create-release.outputs.tag }}
      ID: ${{ needs.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}
      # A draft can't be looked up by tag, so everything goes through its id.
      - name: Rebuild latest.json from the signed bundles
        run: |
          mkdir sigs
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
          while read -r aid name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "sigs/$name"
          done
          ls sigs
          python3 scripts/updater_manifest.py "$TAG" "$GITHUB_REPOSITORY" sigs
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          gh api -X POST -H "Content-Type: application/json" --input latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=latest.json" > /dev/null
      - name: Publish
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true > /dev/null
