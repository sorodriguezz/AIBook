<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a251d"/>
      <stop offset="1" stop-color="#15130f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e9dfcb"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9cdb4"/>
      <stop offset="1" stop-color="#bfb196"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4503a"/>
      <stop offset="1" stop-color="#a83322"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <!-- page behind, slightly rotated -->
  <g transform="rotate(-7 512 540)" filter="url(#shadow)">
    <rect x="292" y="248" width="400" height="530" rx="14" fill="url(#back)"/>
  </g>

  <!-- front page -->
  <g filter="url(#shadow)">
    <rect x="322" y="232" width="400" height="540" rx="14" fill="url(#page)"/>
  </g>

  <!-- Latin lines (top half) -->
  <g fill="#3b342a" opacity="0.78">
    <rect x="372" y="322" width="228" height="20" rx="10"/>
    <rect x="372" y="370" width="300" height="12" rx="6"/>
    <rect x="372" y="402" width="276" height="12" rx="6"/>
    <rect x="372" y="434" width="294" height="12" rx="6"/>
    <rect x="372" y="466" width="196" height="12" rx="6"/>
  </g>

  <!-- the same lines "translated": short CJK-like strokes (bottom half) -->
  <g fill="#3b342a" opacity="0.78">
    <g transform="translate(372 530)">
      <rect x="0" y="0" width="22" height="22" rx="4"/><rect x="34" y="0" width="22" height="22" rx="4"/>
      <rect x="68" y="0" width="22" height="22" rx="4"/><rect x="102" y="0" width="22" height="22" rx="4"/>
      <rect x="136" y="0" width="22" height="22" rx="4"/><rect x="170" y="0" width="22" height="22" rx="4"/>
      <rect x="204" y="0" width="22" height="22" rx="4"/><rect x="238" y="0" width="22" height="22" rx="4"/>
    </g>
    <g transform="translate(372 572)">
      <rect x="0" y="0" width="22" height="22" rx="4"/><rect x="34" y="0" width="22" height="22" rx="4"/>
      <rect x="68" y="0" width="22" height="22" rx="4"/><rect x="102" y="0" width="22" height="22" rx="4"/>
      <rect x="136" y="0" width="22" height="22" rx="4"/><rect x="170" y="0" width="22" height="22" rx="4"/>
    </g>
    <g transform="translate(372 614)">
      <rect x="0" y="0" width="22" height="22" rx="4"/><rect x="34" y="0" width="22" height="22" rx="4"/>
      <rect x="68" y="0" width="22" height="22" rx="4"/><rect x="102" y="0" width="22" height="22" rx="4"/>
      <rect x="136" y="0" width="22" height="22" rx="4"/><rect x="170" y="0" width="22" height="22" rx="4"/>
      <rect x="204" y="0" width="22" height="22" rx="4"/>
    </g>
  </g>

  <!-- divider between the two scripts -->
  <rect x="372" y="502" width="300" height="3" rx="1.5" fill="#c4402b" opacity="0.55"/>

  <!-- bookmark ribbon -->
  <path d="M624 200 h54 v402 l-27 -30 l-27 30 z" fill="url(#ribbon)"/>
  <rect x="624" y="200" width="10" height="400" fill="#ffffff" opacity="0.10"/>
</svg>
